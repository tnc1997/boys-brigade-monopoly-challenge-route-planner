name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build styles
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html *.js styles.css _site/
          # A new sw.js for every deploy, so each one saves its own complete set of files.
          sed -i "s/^const DEPLOY_VERSION = 'local';$/const DEPLOY_VERSION = '${GITHUB_SHA}';/" _site/sw.js
          grep -q "^const DEPLOY_VERSION = '${GITHUB_SHA}';$" _site/sw.js
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
