name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build styles
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html app.js locations.js map.js planner.js route.js search.js sets.js settings.js setup.js share.js storage.js styles.css sw.js _site/
          # Name the deploy after its files, so a new sw.js saves a complete new set
          # whenever they change, but a push that doesn't change them (such as to
          # the README or tests) doesn't ask teams to update.
          version=$(cd _site && sha256sum * | sha256sum | cut -c1-16)
          sed -i "s/^const DEPLOY_VERSION = 'local';$/const DEPLOY_VERSION = '${version}';/" _site/sw.js
          grep -q "^const DEPLOY_VERSION = '${version}';$" _site/sw.js
          # Mark each file with the deploy, so the service worker can tell when a
          # server still has a copy from another deploy.
          for file in _site/*.js; do
            [ "$file" = _site/sw.js ] || printf '\n// deploy: %s\n' "$version" >> "$file"
          done
          printf '\n/* deploy: %s */\n' "$version" >> _site/styles.css
          printf '<!-- deploy: %s -->\n' "$version" >> _site/index.html
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
